name: "swmr_mp"

on:
  push:
    branches: [ main ]

jobs:
  analyze:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # hsds pins numcodecs<=0.15.1, which has no wheels for 3.14+
          # and fails to build from source.
          python-version: '3.13'
      - name: install hsds
        run: |
          pip install hsds
      - name: install h5pyd
        run: |
          pip install h5pyd
      - name: start server
        run: |
          mkdir ~/hsds_data
          hsds --root_dir ~/hsds_data &
        shell: bash
      - name: test
        run: |
          python test/swmr_mp.py

